spring.application.name=hello_server

# Where the database is: this machine, MySQL's default port 3306, database roomdb.
# The datasource (HikariCP connection pool) opens connections with this account at startup,
# so a wrong password or a stopped MySQL fails immediately.
spring.datasource.url=jdbc:mysql://localhost:3306/roomdb
spring.datasource.username=roomapp
spring.datasource.password=roomapp1234

# validate: Hibernate never creates or changes tables; it only checks at startup that every
# @Entity matches an existing table/column, and refuses to start if not.
# schema.sql / reset.sql (with the CHECK and FOREIGN KEY) is the source of truth.
spring.jpa.hibernate.ddl-auto=validate
# Which SQL flavour Hibernate should generate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Print every SQL statement Hibernate sends, nicely formatted, so we can read it in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
